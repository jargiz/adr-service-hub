name: ADR Service Agent
version: "0.17.1"
slug: adr_service_agent
description: "Automatic monitoring and Internet speed tests; read-only network, Sonos, Bluesound, Sense, Control4, Crestron and CP4-R diagnostics; single-outlet WattBox pilot."
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:tools
panel_title: ADR Service
panel_admin: true
homeassistant_api: true
hassio_api: false
host_network: false
options:
  automatic_monitoring: true
  monitor_interval_minutes: 20
  automatic_speedtests: true
  speedtest_interval_minutes: 360
  wattbox_host: ""
  ssh_port: 22
  username: ""
  password: ""
  test_outlet: 11
  expected_outlet_label: "Apple TV"
  device_alias: "Test Apple TV"
  allow_reboot: false
  araknis_host: ""
  araknis_ssh_port: 22
  araknis_username: ""
  araknis_password: ""
  cp4_host: ""
  cp4_ssh_port: 22
  cp4_username: ""
  cp4_password: ""
  ruckus_controller_host: ""
  ruckus_controller_port: 443
  ruckus_controller_username: ""
  ruckus_controller_password: ""
schema:
  automatic_monitoring: bool?
  monitor_interval_minutes: int(5,1440)?
  automatic_speedtests: bool?
  speedtest_interval_minutes: int(60,10080)?
  wattbox_host: str
  ssh_port: port
  username: str
  password: password
  test_outlet: int(1,18)
  expected_outlet_label: str
  device_alias: str
  allow_reboot: bool
  araknis_host: str?
  araknis_ssh_port: port?
  araknis_username: str?
  araknis_password: password?
  cp4_host: str?
  cp4_ssh_port: port?
  cp4_username: str?
  cp4_password: password?
  ruckus_controller_host: str?
  ruckus_controller_port: port?
  ruckus_controller_username: str?
  ruckus_controller_password: password?
