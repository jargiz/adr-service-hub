name: ADR Service Agent
version: "0.3.0"
slug: adr_service_agent
description: "WattBox test reboot, Sonos states and Ruckus presence diagnostics. Experimental pilot."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
stage: experimental
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:tools
panel_title: ADR Service
panel_admin: true
homeassistant_api: true
hassio_api: false
host_network: false
options:
  wattbox_host: ""
  ssh_port: 22
  username: ""
  password: ""
  test_outlet: 11
  expected_outlet_label: "Apple TV"
  device_alias: "Test Apple TV"
  allow_reboot: false
schema:
  wattbox_host: str
  ssh_port: port
  username: str
  password: password
  test_outlet: int(1,18)
  expected_outlet_label: str
  device_alias: str
  allow_reboot: bool
