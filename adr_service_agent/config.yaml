  cp4_ssh_port: 22
  cp4_username: ""
  cp4_password: ""
schema:
  wattbox_host: str
  ssh_port: port
  username: str
  password: password
  test_outlet: int(1,18)
  expected_outlet_label: str
  device_alias: str
  allow_reboot: bool
  araknis_host: str?
  araknis_ssh_port: port?
