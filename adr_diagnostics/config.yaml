name: ADR Diagnostics Preview
version: "0.1.1"
slug: adr_diagnostics
description: "Local network diagnostics, observed-device history and optional Ask ADR analysis."
arch:
  - aarch64
  - amd64
startup: application
boot: manual
stage: experimental
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-check
panel_title: ADR Diagnostics
panel_admin: true
homeassistant_api: false
hassio_api: false
host_network: false
privileged:
  - NET_RAW
options:
  allowed_subnets: []
  targets: []
  dns_name: "example.com"
  automatic_monitoring: false
  monitor_interval_minutes: 20
  cloud_analysis_enabled: false
  openai_api_key: ""
  openai_model: ""
schema:
  allowed_subnets:
    - str
  targets:
    - str
  dns_name: str
  automatic_monitoring: bool
  monitor_interval_minutes: int(5,1440)
  cloud_analysis_enabled: bool
  openai_api_key: password
  openai_model: str
